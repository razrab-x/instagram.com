<!DOCTYPE html>
<html>
<head>
    <title>Standoff 3</title>
    <style>
        body { margin: 0; background: #1a1a1a; display: flex; justify-content: center; align-items: center; height: 100vh; color: white; font-family: sans-serif; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
        canvas { background: #000; border: 4px solid #444; border-radius: 10px; width: 400px; height: 400px; cursor: pointer; -webkit-user-select: none; user-select: none; }
    </style>
</head>
<body>
<canvas id="gameCanvas" width="400" height="400"></canvas>
<script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");

    let playerName = localStorage.getItem("playerName") || "";
    let gameState = playerName ? 'menu' : 'login'; 
    let shopOpen = false, adminPanelOpen = false;
    let score = 0, money = 0, hp = 100, armor = 0;
    
    let weapon = "MP5";
    let ammo = { 
        "9x19mm": { cur: 30, stock: 150, capacity: 30 }, 
        ".50 AE": { cur: 0, stock: 0, capacity: 7 },
        "5.56x45": { cur: 0, stock: 0, capacity: 30 },
        "8.6x70": { cur: 0, stock: 0, capacity: 5 }
    };

    let player = { x: 185, y: 300 };
    let bullets = [], enemyBullets = [], enemies = [];

    function getPlayerStats() { return parseInt(localStorage.getItem("bestScore_" + playerName) || "0"); }
    const ranks = [{name:"LEGEND",kills:100},{name:"Elite",kills:70},{name:"Master",kills:60},{name:"Champion",kills:55},{name:"Ranger",kills:50},{name:"Phoenix",kills:45},{name:"Gold 3",kills:38},{name:"Gold 2",kills:35},{name:"Gold 1",kills:30},{name:"Silver 3",kills:28},{name:"Silver 2",kills:25},{name:"Silver 1",kills:20},{name:"Bronze 3",kills:17},{name:"Bronze 2",kills:15},{name:"Bronze 1",kills:10},{name:"Newbie",kills:0}];
    function getRank(k) { return ranks.find(r => k >= r.kills).name; }

    canvas.addEventListener("click", (e) => {
        let rect = canvas.getBoundingClientRect();
        let mx = e.clientX - rect.left, my = e.clientY - rect.top;

        if (gameState === 'login') {
            if (mx > 125 && mx < 275 && my > 200 && my < 240) {
                let n = prompt("Ник:"); let p = prompt("Пароль:");
                if (localStorage.getItem("pass_" + n) === p) { playerName = n; localStorage.setItem("playerName", n); gameState = 'menu'; }
            }
        } else if (gameState === 'menu') {
            if (mx > 10 && mx < 120 && my > 10 && my < 40) {
                let n = prompt("Ник:"); let p = prompt("Пароль:");
                if (localStorage.getItem("pass_" + n) === p) { playerName = n; localStorage.setItem("playerName", n); }
            } else if (mx > 280 && mx < 390 && my > 10 && my < 40) {
                let n = prompt("Ник:"); let p1 = prompt("Пароль:"); let p2 = prompt("Подтверждение:");
                if (n && p1 && p1 === p2) { localStorage.setItem("pass_" + n, p1); alert("Аккаунт создан!"); }
            } else if (mx > 125 && mx < 275 && my > 200 && my < 240) {
                gameState = 'playing'; score = 0; money = 0; hp = 100; armor = 0;
                weapon = "MP5"; 
                ammo = { "9x19mm": { cur: 30, stock: 150, capacity: 30 }, ".50 AE": { cur: 0, stock: 0, capacity: 7 }, "5.56x45": { cur: 0, stock: 0, capacity: 30 }, "8.6x70": { cur: 0, stock: 0, capacity: 5 } };
            }
        } else if (gameState === 'playing' || gameState === 'paused') {
            if (adminPanelOpen) {
                if (mx > 100 && mx < 250 && my > 100 && my < 180) {
                    if (my < 140) hp = 10000; else money = 10000;
                    adminPanelOpen = false;
                } else adminPanelOpen = false;
            } else if (shopOpen) {
                if (mx > 100 && mx < 300) {
                    if (my > 90 && my < 110 && money >= 60) { money -= 60; armor = 100; shopOpen = false; }
                    else if (my > 110 && my < 130 && money >= 120) { money -= 120; weapon = "Desert Eagle"; ammo[".50 AE"] = { cur: 7, stock: 20, capacity: 7 }; shopOpen = false; }
                    else if (my > 130 && my < 150 && money >= 150) { money -= 150; weapon = "M4A1"; ammo["5.56x45"] = { cur: 30, stock: 30, capacity: 30 }; shopOpen = false; }
                    else if (my > 150 && my < 170 && money >= 140) { money -= 140; weapon = "AWM"; ammo["8.6x70"] = { cur: 5, stock: 20, capacity: 5 }; shopOpen = false; }
                    else if (my > 170 && my < 190 && money >= 45) { money -= 45; ammo[".50 AE"].stock += 30; shopOpen = false; }
                    else if (my > 190 && my < 210 && money >= 30) { money -= 30; ammo["5.56x45"].stock += 45; shopOpen = false; }
                    else if (my > 210 && my < 230 && money >= 50) { money -= 50; ammo["8.6x70"].stock += 10; shopOpen = false; }
                    else shopOpen = false;
                } else shopOpen = false;
            } else {
                if (my > 350 && my < 390) {
                    if (mx > 10 && mx < 60) player.x = Math.max(0, player.x - 35);
                    else if (mx > 70 && mx < 120) player.x = Math.min(370, player.x + 35);
                    else if (mx > 200 && mx < 280) {
                        let type = weapon === "MP5" ? "9x19mm" : (weapon === "Desert Eagle" ? ".50 AE" : (weapon === "M4A1" ? "5.56x45" : "8.6x70"));
                        let need = ammo[type].capacity - ammo[type].cur;
                        if (need > 0 && ammo[type].stock > 0) { let take = Math.min(need, ammo[type].stock); ammo[type].cur += take; ammo[type].stock -= take; }
                    } else if (mx > 300 && mx < 380) {
                        let type = weapon === "MP5" ? "9x19mm" : (weapon === "Desert Eagle" ? ".50 AE" : (weapon === "M4A1" ? "5.56x45" : "8.6x70"));
                        if (ammo[type].cur > 0) { bullets.push({ x: player.x + 12, y: 300 }); ammo[type].cur--; }
                    }
                } else if (mx > 10 && mx < 60 && my > 45 && my < 75) shopOpen = true;
                else if (playerName === "Razrab" && mx > 70 && mx < 120 && my > 45 && my < 75) adminPanelOpen = true;
                else if (mx > 260 && mx < 320 && my > 10 && my < 40) gameState = (gameState === 'playing') ? 'paused' : 'playing';
                else if (mx > 330 && mx < 390 && my > 10 && my < 40) gameState = 'menu';
            }
        }
    });

    setInterval(() => { if (gameState === 'playing' && !shopOpen && !adminPanelOpen) enemies.push({ x: Math.random() * 370, y: -30, speed: 1.5, lastShot: Date.now() }); }, 2000);

    function loop() {
        ctx.fillStyle = "#000"; ctx.fillRect(0, 0, 400, 400);
        if (gameState === 'login') {
            ctx.fillStyle = "#fff"; ctx.textAlign = "center"; ctx.fillText("СТЕНДОФФ 3", 200, 100);
            ctx.fillStyle = "#d35400"; ctx.fillRect(125, 200, 150, 40); ctx.fillStyle = "#fff"; ctx.fillText("ВОЙТИ", 200, 227);
        } else if (gameState === 'menu') {
            ctx.fillStyle = "#fff"; ctx.textAlign = "center";
            ctx.fillText("Ник: " + playerName, 200, 40); ctx.fillText("Рекорд: " + getPlayerStats(), 200, 60); ctx.fillText("Звание: " + getRank(getPlayerStats()), 200, 80);
            ctx.fillStyle = "#444"; ctx.fillRect(10, 10, 110, 30); ctx.fillRect(280, 10, 110, 30);
            ctx.fillStyle = "#fff"; ctx.font = "12px Arial"; ctx.fillText("Войти", 65, 30); ctx.fillText("Создать", 335, 30);
            ctx.fillStyle = "#555"; ctx.fillRect(125, 200, 150, 40); ctx.fillStyle = "#fff"; ctx.font = "20px Arial"; ctx.fillText("ИГРАТЬ", 200, 228);
            ctx.font = "10px Arial"; ctx.textAlign = "left";
            ranks.forEach((r, i) => { ctx.fillText(r.name + ": " + r.kills + "+", 20 + (Math.floor(i/8)*200), 280 + (i%8)*15); });
        } else {
            if (gameState === 'playing' && !shopOpen && !adminPanelOpen) {
                bullets.forEach((b, i) => { b.y -= 7; if (b.y < 0) bullets.splice(i, 1); });
                enemyBullets.forEach((b, i) => { b.y += 5; if (b.y > 400) enemyBullets.splice(i, 1); 
                    if(b.x > player.x && b.x < player.x+30 && b.y > 300 && b.y < 330) { if(armor > 0) armor -= 10; else hp -= 5; enemyBullets.splice(i,1); }
                });
                enemies.forEach((e, i) => {
                    e.y += e.speed;
                    if (Date.now() - e.lastShot > 1500) { enemyBullets.push({x: e.x + 15, y: e.y + 30}); e.lastShot = Date.now(); }
                    bullets.forEach((b, bi) => {
                        if (b.x > e.x && b.x < e.x + 30 && b.y > e.y && b.y < e.y + 30) {
                            enemies.splice(i, 1); bullets.splice(bi, 1); score++; money += 5;
                            localStorage.setItem("bestScore_" + playerName, Math.max(score, getPlayerStats()));
                        }
                    });
                });
            }
            let type = weapon === "MP5" ? "9x19mm" : (weapon === "Desert Eagle" ? ".50 AE" : (weapon === "M4A1" ? "5.56x45" : "8.6x70"));
            ctx.fillStyle = "#fff"; ctx.font = "14px Arial"; ctx.textAlign = "start";
            ctx.fillText(weapon + " | Маг: " + ammo[type].cur + " | Запас: " + ammo[type].stock, 10, 20);
            ctx.fillText("HP: " + hp + " | Бр: " + armor + "% | $" + money, 10, 40);
            ctx.fillStyle = "#444"; ctx.fillRect(10, 45, 50, 30);
            if (playerName === "Razrab") ctx.fillRect(70, 45, 50, 30);
            ctx.fillRect(260, 10, 60, 30); ctx.fillRect(330, 10, 60, 30);
            ctx.fillStyle = "#fff"; ctx.fillText("Шоп", 20, 65);
            if (playerName === "Razrab") ctx.fillText("Админ", 75, 65);
            ctx.fillText(gameState === 'playing' ? "Пауза" : "Пуск", 270, 30); ctx.fillText("Меню", 340, 30);
            
            if (shopOpen) { 
                ctx.fillStyle="#333"; ctx.fillRect(90, 80, 220, 160); ctx.fillStyle="#fff";
                ctx.fillText("Броня ($60)", 100, 105); ctx.fillText("Desert Eagle ($120)", 100, 125); 
                ctx.fillText("M4A1 ($150)", 100, 145); ctx.fillText("AWM ($140)", 100, 165); 
                ctx.fillText("Патр. DE ($45)", 100, 185); ctx.fillText("Патр. M4 ($30)", 100, 205);
                ctx.fillText("Патр. 8.6x70 ($50)", 100, 225);
            }
            if (adminPanelOpen) {
                ctx.fillStyle="#500"; ctx.fillRect(100, 100, 150, 80); ctx.fillStyle="#fff";
                ctx.fillText("10,000 HP", 120, 130); ctx.fillText("10,000 $", 120, 160);
            }
            ctx.fillStyle = "#333"; ctx.fillRect(10, 350, 50, 40); ctx.fillRect(70, 350, 50, 40); ctx.fillRect(200, 350, 80, 40); ctx.fillRect(300, 350, 80, 40);
            ctx.fillStyle = "#fff"; ctx.fillText("<", 30, 375); ctx.fillText(">", 90, 375); ctx.fillText("R", 235, 375); ctx.fillText("ОГОНЬ", 315, 375);
            ctx.fillStyle = armor > 0 ? "#00f" : "#0f0"; ctx.fillRect(player.x, 300, 30, 30);
            enemies.forEach(e => { ctx.fillStyle = "#f00"; ctx.fillRect(e.x, e.y, 30, 30); });
            bullets.forEach(b => { ctx.fillStyle = "#fff"; ctx.fillRect(b.x, b.y, 5, 5); });
            enemyBullets.forEach(b => { ctx.fillStyle = "#ff0"; ctx.fillRect(b.x, b.y, 5, 5); });
            if (hp <= 0) gameState = 'menu';
        }
        requestAnimationFrame(loop);
    }
    loop();
</script>
</body>
</html>
